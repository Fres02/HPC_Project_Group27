<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacobi Serial Solver - Interactive Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .control-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .control-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        select, input {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px 28px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-run {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-run:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .btn-run.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .results-title {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkmark {
            color: #4caf50;
            font-weight: bold;
        }

        .test-result {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .test-result:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .test-header {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .test-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-item {
            padding: 10px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #764ba2;
        }

        .detail-label {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-size: 1.15em;
            font-weight: 600;
            margin-top: 4px;
            font-family: 'Courier New', monospace;
        }

        .summary-table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .summary-table thead {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .summary-table th,
        .summary-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .summary-table tbody tr:hover {
            background: #f5f5f5;
        }

        .summary-table tbody tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-warning {
            background: #fff3cd;
            color: #856404;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading-spinner.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-text {
            color: #666;
            margin-top: 10px;
            font-weight: 500;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .control-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .test-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 Jacobi Serial Solver</h1>
            <p class="subtitle">Interactive Demonstration - Heat Equation Solver</p>
        </header>

        <div class="control-section">
            <h2>⚙️ Configure Test Parameters</h2>
            <div style="margin-top: 20px;">
                <div class="control-row">
                    <div class="form-group">
                        <label for="gridSize">Grid Size (N×N):</label>
                        <select id="gridSize">
                            <option value="10">10 × 10</option>
                            <option value="20" selected>20 × 20</option>
                            <option value="50">50 × 50</option>
                            <option value="100">100 × 100</option>
                            <option value="200">200 × 200</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="maxIterations">Max Iterations:</label>
                        <select id="maxIterations">
                            <option value="1000">1,000</option>
                            <option value="5000">5,000</option>
                            <option value="10000" selected>10,000</option>
                            <option value="50000">50,000</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tolerance">Tolerance:</label>
                        <select id="tolerance">
                            <option value="1e-4">1e-4</option>
                            <option value="1e-5">1e-5</option>
                            <option value="1e-6" selected>1e-6</option>
                            <option value="1e-7">1e-7</option>
                            <option value="1e-8">1e-8</option>
                        </select>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-run" id="runBtn">▶ Run Solver</button>
                    <button class="btn-reset" id="resetBtn">↻ Reset</button>
                </div>
            </div>
        </div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <div class="spinner-text">Computing solution...</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="results-section" id="resultsSection">
            <div class="results-title">
                <span class="checkmark">✓</span> Solver Results
            </div>

            <div id="testResults"></div>

            <table class="summary-table">
                <thead>
                    <tr>
                        <th>Grid Size</th>
                        <th>Status</th>
                        <th>Iterations</th>
                        <th>Final Error</th>
                    </tr>
                </thead>
                <tbody id="summaryTable">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const gridSizeSelect = document.getElementById('gridSize');
        const maxIterSelect = document.getElementById('maxIterations');
        const toleranceSelect = document.getElementById('tolerance');
        const runBtn = document.getElementById('runBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const resultsSection = document.getElementById('resultsSection');
        const testResults = document.getElementById('testResults');
        const summaryTable = document.getElementById('summaryTable');
        const errorMessage = document.getElementById('errorMessage');

        // Mock data generator (simulates C solver output)
        function generateMockResults(gridSize, maxIter, tolerance) {
            // Simulate realistic convergence behavior based on grid size
            // Larger grids need more iterations for convergence
            const iterationEstimate = Math.ceil(gridSize * gridSize * 0.3);
            const actualIterations = Math.min(iterationEstimate, maxIter);
            const converged = actualIterations < maxIter;
            const finalError = converged ? tolerance * 0.9 : tolerance * 1.5;

            return {
                gridSize: gridSize,
                iterations: actualIterations,
                finalError: finalError,
                tolerance: tolerance,
                converged: converged,
                executionTime: (Math.random() * 2 + 0.5).toFixed(2) + 's'
            };
        }

        function formatNumber(num) {
            return num.toLocaleString();
        }

        function formatScientific(num) {
            return num.toExponential(8);
        }

        function runSolver() {
            const gridSize = parseInt(gridSizeSelect.value);
            const maxIter = parseInt(maxIterSelect.value);
            const tolerance = parseFloat(toleranceSelect.value);

            // Show loading spinner
            loadingSpinner.classList.add('show');
            resultsSection.classList.remove('show');
            errorMessage.classList.remove('show');
            runBtn.disabled = true;
            runBtn.classList.add('loading');

            // Simulate computation delay (more delay for larger grids)
            const delay = 1000 + (gridSize / 10) * 200 + Math.random() * 1000;
            
            setTimeout(() => {
                try {
                    // Generate mock result (in real implementation, this would call backend)
                    const result = generateMockResults(gridSize, maxIter, tolerance);

                    // Display results
                    displayResults(result, tolerance);

                    loadingSpinner.classList.remove('show');
                    resultsSection.classList.add('show');
                } catch (error) {
                    showError('Error running solver: ' + error.message);
                    loadingSpinner.classList.remove('show');
                } finally {
                    runBtn.disabled = false;
                    runBtn.classList.remove('loading');
                }
            }, delay);
        }

        function displayResults(result, tolerance) {
            // Display test result
            const statusBadge = result.converged
                ? '<span class="status-badge status-success">✓ Converged</span>'
                : '<span class="status-badge status-warning">⚠ Max Iterations</span>';

            const resultHTML = `
                <div class="test-result">
                    <div class="test-header">
                        Test Configuration: ${result.gridSize}×${result.gridSize} Grid
                    </div>
                    <div class="test-details">
                        <div class="detail-item">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">${statusBadge}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Iterations</div>
                            <div class="detail-value">${formatNumber(result.iterations)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Final Error</div>
                            <div class="detail-value">${formatScientific(result.finalError)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Tolerance</div>
                            <div class="detail-value">${formatScientific(tolerance)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Execution Time</div>
                            <div class="detail-value">${result.executionTime}</div>
                        </div>
                    </div>
                </div>
            `;

            testResults.innerHTML = resultHTML;

            // Update summary table
            const statusClass = result.converged ? 'status-success' : 'status-warning';
            const statusText = result.converged ? 'Converged' : 'Max Iterations';
            
            summaryTable.innerHTML = `
                <tr>
                    <td><strong>${result.gridSize}×${result.gridSize}</strong></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${formatNumber(result.iterations)}</td>
                    <td><code>${formatScientific(result.finalError)}</code></td>
                </tr>
            `;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function resetForm() {
            gridSizeSelect.value = '20';
            maxIterSelect.value = '10000';
            toleranceSelect.value = '1e-6';
            resultsSection.classList.remove('show');
            errorMessage.classList.remove('show');
            loadingSpinner.classList.remove('show');
        }

        // Event listeners
        runBtn.addEventListener('click', runSolver);
        resetBtn.addEventListener('click', resetForm);

        // Allow Enter key to run solver
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !runBtn.disabled) {
                runSolver();
            }
        });
    </script>
</body>
</html>
